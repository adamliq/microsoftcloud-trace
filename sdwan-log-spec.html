  <h2>Log to component</h2>
  <div class="tw"><table><thead><tr><th>Log</th><th class="ck">Manager</th><th class="ck">Controller</th><th class="ck">Validator</th><th class="ck">Host OS</th><th class="ck">Firewall</th></tr></thead><tbody>
  ${LOGS.map(l=>`<tr><td><a href="#spec-${l.k}">${l.id}</a> <span class="path">${esc(l.paths[0])}</span></td>${['m','c','v','s','f'].map(x=>`<td class="ck${l.comps[x]?'':' no'}">${l.comps[x]?'✓':'–'}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  <h2>Collection priority</h2>
  ${tbl(['Priority','Focus','What and why'],[
   ['<b style="color:var(--crit)">P1</b> always forward','Manager, Controller, Validator','vsyslog, messages, auth.log: control connections, auth failures, logins'],
   ['<b style="color:var(--crit)">P1</b> Manager only','Manager','Audit log (API) and alarms: admin actions and fabric health'],
   ['<b style="color:var(--crit)">P1</b> boundary','Perimeter firewall','SSH, HTTPS and NETCONF allow and deny from non-jump sources'],
   ['<b style="color:var(--med)">P2</b> local','All control components','vdebug, vconfd, rollback, shell history: incident response and deep dives'],
   ['<b style="color:var(--med)">P2</b> system','All control components','kern.log, runit.log: reboot and service timing']])}
  <h2>Incident-response quick map</h2>
  ${tbl(['Symptom or hunt','Primary component','Primary logs'],[
   ['Rogue control connection or unknown peer-type','Controller, Validator',`${ll('vsyslog')}, ${ll('vdebug')}`],
   ['Auth failure or unknown serial','Controller, Manager',`${ll('vsyslog')}, ${ll('vdebug')}, ${ll('audit')}`],
   ['Unexpected root or SSH login','Any control component',`${ll('auth')}, ${ll('wtmp')}, ${ll('ssh')}`],
   ['Config change or rollback','Manager, Controller',`${ll('audit')}, ${ll('rollback')}, ${ll('vconfd')}`],
   ['Software downgrade or unconfirmed upgrade','Controller, Manager',`${ll('vdebug')}, ${ll('sync')}, ${ll('runit')}, ${ll('kern')}`],
   ['Account lock or brute force','Any control component',`${ll('auth')}, ${ll('faillock')}`],
   ['Perimeter exposure of 22, 443 or 830','Firewall and management path',`${ll('firewall')}, ${ll('auth')}`]])}
  <h2>Source categories</h2>
  ${tbl(['Source','Description','Transport'],[
   ['Local disk','Files under /var/log and /var/volatile/log on each component','On-box until collected'],
   ['Remote syslog','The same messages streamed by system logging server','UDP, TCP or TLS to the SIEM'],
   ['Manager API / Elasticsearch','Structured audit log and statistics','HTTPS REST (/dataservice/…)'],
   ['Alarms and events','High-level fabric alerts','Webhook, email or API'],
   ['Admin-tech or snapshot','Bundle of local files including vdebug, volatile logs and history','Manual or scheduled download'],
   ['Perimeter firewall','Allow and deny at the DMZ and VPN 512','Firewall syslog or API'],
   ['Config and state files','SSH keys, rollback, faillock, wtmp','Snapshot, admin-tech or vshell']])}
  <h2>Log to source</h2>
  <div class="tw"><table><thead><tr><th>Log</th><th class="ck">Local disk</th><th class="ck">Remote syslog</th><th class="ck">Manager API</th><th class="ck">Admin-tech or snapshot</th><th>Other</th></tr></thead><tbody>
  ${LOGS.map(l=>`<tr><td><a href="#spec-${l.k}">${l.id}</a> ${esc(l.name)}</td>${['disk','syslog','api','at'].map(x=>{const v=l.src[x];return `<td class="ck${(!v||v==='✗')?' no':''}">${esc(v||'–')}</td>`;}).join('')}<td>${esc(l.src.other)}</td></tr>`).join('')}
  </tbody></table></div>
  <h2>Recommended collection path</h2>
  ${tbl(['Source','How to enable or collect','SIEM notes'],[
   ['Remote syslog (vsyslog, messages, auth, kern)','<span class="mono">system logging server &lt;SIEM&gt; vpn 512 source-interface &lt;intf&gt; priority informational</span>, TLS preferred','Primary continuous feed; split the sourcetype with the <a href="#parsing">routing patterns</a>'],
   ['Manager audit log','REST API <span class="mono">/dataservice/auditlog/…</span>; size retention under Administration → Settings → Statistics Database Configuration','Pull on a schedule; treat as a structured JSON sourcetype'],
   ['Alarms and events','Alarm notification webhook or API','Map to <span class="mono">cisco:sdwan:alarms</span>'],
   ['vdebug, volatile logs, history','<span class="mono">request admin-tech</span> or a filesystem snapshot before reboot','Incident response only; high volume; don’t enable verbose debug globally'],
   ['nms','Local plus admin-tech; limited syslog','Prefer the audit API for admin actions'],
   ['Perimeter firewall','Log allow and deny on VPN 0 and VPN 512; forward to the same SIEM','Correlate with auth.log and control-connection events'],
   ['SSH, rollback, faillock','Scheduled vshell checks or config snapshots; admin-tech on demand','File integrity and baseline monitoring']])}
  <h2>Never in the syslog stream</h2>
  <p>These must be collected another way, so plan incident-response playbooks around admin-tech and API pulls:</p>
  <ul class="plain">${['vdebug','runit','wtmp','faillock','rollback','ssh','history','sync','audit'].map(k=>`<li>${ll(k)}</li>`).join('')}<li>Full ${ll('nms')} detail (prefer the audit API)</li></ul>
  <h2>Identity fields to keep in the SIEM</h2>
  ${tbl(['Field','Purpose'],[['<span class="mono">host</span>','Control component hostname'],['<span class="mono">system_ip</span>','SD-WAN system-IP, from the message or inventory'],['<span class="mono">component</span>','manager, controller, validator or firewall'],['<span class="mono">source</span>','Original path or channel, such as vsyslog, auth.log or vmanage_audit'],['<span class="mono">sourcetype</span>','Split family, such as cisco:sdwan:vsyslog'],['<span class="mono">vpn, source_interface</span>','Useful with multiple logging servers or VRFs']])}
</div>`;

/* ---- enable ---- */
TITLES.enable='Enable logging';
PAGES.enable=()=>`<div class="page">
  <h1>Enable logging</h1>
  <p class="lede">Most sources are written locally by default. The work is getting them off the box before they can be wiped, and collecting the ones that never travel over syslog.</p>
  <div class="note warn">Keyword spelling varies between releases. Validate every command on one Controller before rolling it out by template.</div>
  <h2>Local disk logging</h2>
  <p>Writes syslog messages to files under <code>/var/log</code> on the component. It’s the foundation for both local retention and remote forwarding, and is enabled by default on most releases.</p>
  <div class="g2">${code('CLI','config\nsystem\n logging\n  disk\n   enable\n   file size 10      # size of each log file in MB (range typically 1–20)\n   file rotate 10    # number of rotated files to keep (range typically 1–10)\n  !\n !\n!\ncommit','no system logging disk enable turns local files off but does not disable vsyslog: control-plane messages still appear in /var/log/vsyslog. Larger file size and rotate values help when you need longer local retention, especially for vdebug during investigations.')}
  <div class="block"><header><h4>SD-WAN Manager</h4></header><pre style="white-space:normal;font-family:var(--sans);font-size:.92rem;line-height:1.6">1. Configuration → Templates → Feature, or Configuration Groups → System profile.<br>2. Open or create a Logging feature.<br>3. Under Disk, enable it and set File Size (MB) and Rotate count.<br>4. Attach to the target devices and deploy.</pre></div></div>
  <h3>What gets written locally</h3>
  ${tbl(['File','Written when disk logging is on'],[['<span class="path">/var/log/vsyslog</span>','Yes, at or above the configured priority'],['<span class="path">/var/log/messages</span>','Yes'],['<span class="path">/var/log/auth.log</span>','Yes'],['<span class="path">/var/log/kern.log</span>','Yes'],['<span class="path">/var/log/vconfd</span>','Yes'],['<span class="path">/var/log/tmplog/vdebug</span>','Yes, plus modules with debugging on'],['<span class="path">/var/log/nms</span> (Manager)','Yes']])}
  <h2>Debug logging (local only)</h2>
  <p>Debug messages go only to <code>vdebug</code> and can’t be sent to a remote syslog server. Enable them only for scoped hunts.</p>
  <div class="g2">${code('Turn on and off','# Operational mode (example – module names vary)\ndebug vdaemon\n# or other module-specific debug commands\n\n# When finished, turn off to avoid filling disk\nno debug all')}${code('Longer retention while debugging','system\n logging\n  disk\n   file size 20\n   file rotate 15\n  !\n !\n!\ncommit\n\nrequest admin-tech')}</div>
  <h2>Remote syslog</h2>
  <p>Covers vsyslog, messages, auth.log, kern.log and related syslog traffic. Configure it on every Manager, Controller and Validator.</p>
  ${code('CLI on Controller, Validator or Manager, with TLS (preferred, release-dependent)','config\nsystem\n logging\n  disk\n   enable\n   file size 10          # MB per file (default 10)\n   file rotate 10        # number of rotated files (default 10)\n  !\n  server 10.0.1.50       # your SIEM / syslog server IP or hostname\n   vpn 512               # management VPN (or the VPN that can reach the SIEM)\n   source-interface eth0 # interface in that VPN\n   priority informational\n   # Optional – TLS (preferred)\n   transport tls\n   tls-profile secure-syslog\n  !\n  # Optional TLS profile\n  tls-profile secure-syslog\n   version TLSv1.2\n   ciphersuite ECDHE-ECDSA-AES128-SHA256 AES256-GCM-SHA384\n  !\n !\n!\ncommit','The TLS keywords come from the field log reference and couldn’t be verified against Cisco documentation. Check them with ? on your release.')}
  <div class="g2">${code('UDP or TCP (no TLS)','server 10.0.1.50\n vpn 512\n source-interface eth0\n transport udp          # or tcp\n priority informational')}${code('Test delivery','request system logging generate level info message "SIEM test"\nshow logging')}</div>
  <p><b>From SD-WAN Manager:</b> Configuration → Templates → Feature → Logging (or Configuration Group → System profile → Logging). Enable Disk, then add a Server with IP, VPN, source interface, priority and transport. The configuration-group System Logging feature in Manager 20.15 and later exposes TLS and a TLS profile per server.</p>
  <h2>Per-log behaviour</h2>
  <div class="tw"><table><thead><tr><th>Log</th><th>Enabled by default</th><th>Remote syslog</th><th>Volatile</th><th>How to enable or forward</th></tr></thead><tbody>
  ${LOGS.map(l=>{const e=ENB[l.k];return `<tr><td><a href="#spec-${l.k}">${l.id}</a> ${esc(l.name)}</td><td>${esc(e[0])}</td><td>${esc(e[1])}</td><td>${l.vol?'Yes':'No'}</td><td>${esc(e[2])}</td></tr>`;}).join('')}
  </tbody></table></div>
  <h2>Manager audit log retention</h2>
  <ul class="plain"><li>Log in to SD-WAN Manager and call <code>https://your-vmanage-ip/dataservice/management/elasticsearch/index/size/estimate</code> in a browser or REST client.</li>
  <li>In the JSON response, find the audit section’s storage requirement, for example 2 GB for 90 days or 8 GB for a year.</li>
  <li>Go to Administration → Settings → Statistics Database Configuration, set the Audit Logs storage limit to that value plus about 20%, and save.</li>
  <li>Review allocations periodically: if log volume doubles, a year of retention becomes six months.</li></ul>
  <h2>Recommended production settings</h2>
  ${code('Baseline','system\n logging\n  disk\n   enable\n   file size 10\n   file rotate 10\n  !\n  server <SIEM-IP>\n   vpn 512\n   source-interface <mgmt-intf>\n   priority informational\n   transport tls\n   tls-profile secure-syslog\n  !\n  tls-profile secure-syslog\n   version TLSv1.2\n   ciphersuite ECDHE-ECDSA-AES128-SHA256 AES256-GCM-SHA384\n  !\n !\n!')}
  <ul class="plain"><li>Use VPN 512 and a dedicated source interface so logging doesn’t depend on the data plane.</li><li>Alert in the SIEM when any control component stops sending; the actor disabled the syslog interface.</li><li>Snapshot or run admin-tech before restarting a suspect device; volatile paths disappear on reboot.</li><li>Plan admin-tech collection for incident response, because vdebug never reaches the SIEM.</li><li>Confirm arrival with <code>show logging</code> and by searching the SIEM for the device’s system-IP or hostname.</li></ul>
</div>`;

/* ---- parsing ---- */
TITLES.parsing='SIEM parsing';
PAGES.parsing=()=>`<div class="page">
  <h1>SIEM parsing</h1>
  <p class="lede">A single syslog feed carries several log families. Split it into sourcetypes on ingest, break events correctly, extract the fields detections need, and enrich with an inventory lookup. Guidance covers Splunk props and transforms, Edge Processor, Ingest Processor and Ingest Actions; the patterns carry over to similar SIEMs.</p>
  <h2>1. Route to sourcetypes</h2>
  <p class="sub">Match on <code>_raw</code>, most specific first. Patterns are PCRE-oriented for Edge Processor and Ingest Processor. vdebug, rollback and audit only appear if you ship them by admin-tech, file upload or API pull.</p>
  ${tbl(['Sourcetype','Distinguishing pattern','Components','Notes'],ROUTE.map(r=>[`<span class="mono">${esc(r[0])}</span>`,`<span class="path">${esc(r[1])}</span>`,esc(r[2]),esc(r[3])]))}
  <p class="sub">Component legend: <b>Manager</b> (vManage) orchestration, UI, audit and policies; <b>Controller</b> (vSmart) control plane and OMP; <b>Validator</b> (vBond) orchestration endpoint; <b>System</b> host OS on any control component.</p>
  ${code('Routing eval for Edge Processor or Ingest Processor (SPL2), most specific first',CODE.route,'SPL2 syntax with slash-delimited regexes. Classic SPL’s match() needs quoted strings instead.')}
  <h2>2. Break events</h2>
  <p class="sub">Assumes events are already split into the sourcetypes above.</p>
  ${tbl(['Sourcetype','SHOULD_LINEMERGE','LINE_BREAKER and notes'],[
   ['<span class="mono">vsyslog, messages, jsyslog, auth, kern, vdebug, vconfd, nms, runit</span>','<span class="mono">false</span>','Default newline; one message per line'],
   ['<span class="mono">cisco:sdwan:audit</span>','<span class="mono">false</span>','If pretty-printed JSON, use a JSON-aware breaker or merge into single-line JSON at collection time'],
   ['<span class="mono">cisco:sdwan:alarms</span>','depends','Webhook payloads may be JSON objects; parse as JSON if structured']])}
  ${code('props.conf event breaking',CODE.breakprops)}
  <h2>3. Extract fields</h2>
  <div class="filters" id="xp" role="group" aria-label="Choose sourcetype"></div>
  <div id="xo"></div>
  <p class="sub">The control-plane block includes the Edge Processor style with <code>(?P&lt;name&gt;…)</code> named groups. Per-log extractions generated from the schema are on each <a href="#schemas">schema explorer</a> page.</p>
  <h2>4. Enrich</h2>
  <p class="sub">Keep a small inventory lookup of system_ip, hostname, component and site_id for every Manager, Controller and Validator. It also turns an unknown peer-system-ip into an instant alert.</p>
  ${code('Enrichment',CODE.enrich)}
  <h2>5. Edge Processor or Ingest Processor pipeline</h2>
  <p>The same five-step pattern works in both processors:</p>
  <ol class="plain"><li>Split the sourcetype with the routing <code>case</code> or a <code>route</code> branch (step 1).</li><li>Run branch or sequential <code>rex</code> for that family’s fields (step 3).</li><li><code>eval</code> component, vendor and product (step 4).</li><li>Optionally <code>lookup</code> against the device inventory.</li><li>Send <code>into</code> the destination index.</li></ol>
  ${code('Pipeline fragment (SPL2)','| rex field=_raw /peer-type:(?P<peer_type>\\S+)/\n| rex field=_raw /peer-system-ip:(?P<peer_system_ip>\\S+)/\n| rex field=_raw /new-state:(?P<new_state>\\S+)/\n| eval vendor="cisco", product="sdwan"')}
  <h2>6. props.conf and transforms.conf (classic Splunk)</h2>
  <div class="g2">${code('props.conf per sourcetype',CODE.props)}${code('transforms.conf',CODE.trans,'Single REGEX lines break when field order varies. For robustness prefer multiple REPORT extractions, or INGEST_EVAL and rex in Edge Processor.')}</div>
  <h2>Must-extract fields for detections</h2>
  ${tbl(['Theme','Fields','Detections'],[
   ['Rogue peer, control connection','<span class="mono">peer_type, peer_system_ip, public_ip, new_state, uptime</span>',dls('003 004 005 006 007 008')],
   ['Auth failure, unknown serial','<span class="mono">reason, serial, peer_system_ip</span>',dls('010')],
   ['Login change, traversal user','<span class="mono">user_name</span>',dls('011 013')],
   ['SSH and root login','<span class="mono">user, src_ip, auth_result</span>',dls('012')],
   ['Admin change','<span class="mono">loguser, logusersrcip, logmessage, logmodule</span>',dls('017 018')],
   ['Wipe or tamper','File size and presence from admin-tech or snapshot metadata',dls('019 020 021 022 023')]])}
  <h2>Pitfalls</h2>
  ${tbl(['Issue','Mitigation'],[['Field order varies in control-connection lines','A separate rex per field, not one rigid REGEX'],['Pre- and post-20.15 syslog headers','An optional second rex for %FACILITY-SEV-MNEMONIC'],['Multi-line JSON audit records','Normalise to single-line JSON before indexing, or use a custom LINE_BREAKER'],['vdebug noise','Parse only during incident response; don’t extract every token in production'],['Truncation at 1024 bytes','Don’t require end-of-line anchors for long messages'],['Timezones','Prefer device UTC; set TZ in props if logs are in local time']])}
</div>`;
AFTER.parsing=()=>{const xp=document.getElementById('xp'),xo=document.getElementById('xo');
  const show=i=>{xp.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));xo.innerHTML=code(X[i][0],X[i][1]);};
  X.forEach((x,i)=>{const b=document.createElement('button');b.className='btn sm';b.type='button';b.textContent=x[0];b.onclick=()=>show(i);xp.appendChild(b);});show(0);};

/* ---- hardening ---- */
TITLES.hardening='Hardening';
PAGES.hardening=()=>`<div class="page">
  <h1>Hardening</h1>
  <p class="lede">Cisco’s Catalyst SD-WAN hardening guide (rev 1.1, February 2026) is the primary source for securing the control components. The hunt guide’s mitigations double as remediation for a compromised fabric.</p>
  <h2>Hunt guide mitigations</h2>
  ${tbl(['Mitigation','What to do'],[['Golden-star release','Run Cisco’s recommended golden-star version so current security features apply.'],['Patch','Patch SD-WAN products as soon as practical.'],['Network filtering','Firewall the fabric so only legitimate edge devices reach it, even where carriers use dynamic ranges. Keep management interfaces off the internet and filtered to admin jump hosts.'],['Data plane security','Use pairwise key exchange for encrypted IPsec.'],['Centralised logging','Enable the logs in this reference and send them off the device to limit defence evasion.']])}
  <h2>Network perimeter</h2>
  <p>Use defence in depth: segmentation plus ACLs and firewall policies that strictly limit who can reach the control components.</p>
  <h3>Cisco-hosted (Cloud Pro)</h3>
  <ul class="plain"><li>In the Cisco Catalyst SD-WAN Portal, choose the fabric, open Inbound Rules and add rules by type (SSH, HTTPS or custom), port range and source IP or prefix. Never use the ALL rule.</li>
  <li>Rules become cloud security groups (AWS Security Groups, Azure NSGs) and apply to every Manager, Validator and Controller in the fabric. The limit is 200 rules per fabric.</li>
  <li>Edge devices don’t need allow-listing: with serials authorised in Manager they connect over mutually authenticated (D)TLS.</li>
  <li>Add further restrictions with Localized Policy templates on the VPN 512 interface.</li></ul>
  <h3>Self-hosted</h3>
  <ul class="plain"><li>Separate the control plane (VPN 0 transport) from the management plane (VPN 512).</li><li>Put VPN 0 interfaces in a DMZ behind a perimeter firewall, ideally with 1:1 NAT from private to public addresses.</li><li>Put VPN 512 in an isolated management VLAN that never routes through the DMZ or internet.</li></ul>
  <h3>Administrative access</h3>
  <p>Don’t reach Manager straight from workstations. Use hardened jump hosts behind MFA and a corporate VPN, and never expose 443, 22 or 830 to the internet.</p>
  <h3>Firewall allow list</h3>
  ${tbl(['Traffic','Port','Allowed source','Destination'],[
   ['DTLS control','<span class="mono">UDP 12346</span> (+100 per core)','Edge devices; any source only for ZTP or dynamic IPs','Validator, Controller, Manager'],
   ['TLS control','<span class="mono">TCP 23456</span> (+100 per core)','Edge devices','Controller, Manager'],
   ['Edge port hopping','<span class="mono">UDP 12346–12445</span>','Edges cycle 12346+n, 12366+n, 12386+n, 12406+n, 12426+n (n = 0–19); wider if NAT randomises ports','Controller, Manager'],
   ['SSH','<span class="mono">TCP 22</span>','Jump host or management subnet only','All components (VPN 512)'],
   ['Web UI','<span class="mono">TCP 443</span>','Jump host or management subnet only','Manager (VPN 512)'],
   ['NETCONF','<span class="mono">TCP 830</span>','Manager only','Controller, Validator'],
   ['DNS, NTP','<span class="mono">UDP 53, UDP 123</span>','As your design requires','Resolvers, time servers']])}
  <p class="sub">Core 1 uses UDP 12446 and TCP 23556, Core 2 UDP 12546 and TCP 23656, and so on.</p>
  <h2>Role-based access control</h2>
  <p>Users get roles; roles define write, read or deny per feature; scope limits which sites, devices or templates they act on. Give no one more than they need.</p>
  ${tbl(['Role','Configurable','Purpose'],[['basic','No','Built-in base role. Copy it to build a modifiable custom role.'],['operator','Yes','View-only users; read-only on templates; no running or local config.'],['netadmin','No','Includes admin; all operations. Only netadmin can see running and local config.'],['network_operations','No','All non-security-policy operations; can apply and revoke policies and edit device templates.'],['security_operations','No','All security operations; needs network_operations on day 0 to deploy a security policy.']])}
  <h2>Web server certificate</h2>
  <p>Replace Manager’s default self-signed certificate with one signed by your enterprise root CA or a trusted public CA.</p>
  <h2>Passwords and authentication</h2>
  ${tbl(['Policy','Length','Rules'],[['Medium','8–32','Lower, upper, number and special character; not the last five passwords; no full name or username'],['High','15–32','As medium, plus at least eight characters changed from the old password']])}
  <ul class="plain"><li>Rotate passwords, use different ones per account, and lock accounts after repeated failures.</li><li>Store passwords encrypted (type 6 in configuration groups) and replace default configuration-database credentials.</li><li>Enable SSO with an on-premises or cloud IdP (Okta, Azure AD), configured in the Portal for Cisco-hosted fabrics, or use native Duo MFA in Manager.</li></ul>
  <h2>Control plane</h2>
  <ul class="plain"><li>Zero trust: all control traffic runs inside authenticated, encrypted DTLS or TLS tunnels using AES-256-GCM. FIPS mode is on by default from release 20.15.1.</li><li>Devices authenticate with certificates installed in software or hard-coded in hardware.</li><li>Configure DTLS encryption for Manager connections. Use SNMPv3 only, with authentication.</li></ul>
  <h2>Data plane</h2>
  <ul class="plain"><li>Traditional key exchange has the Controller send IPsec keys; pairwise exchange sends Diffie-Hellman values so edges derive keys with ECDH on P-384.</li><li>Enhanced ESP (AES-GCM-256) also protects outer IP and UDP headers and blocks replay. Integrity options: esp, ip-udp-esp, ip-udp-esp-no-id, or none (not recommended).</li><li>From IOS XE 17.11.1a, DH groups 1, 2 and 5 are removed; third-party IKE peers need group 14, 15 or 16.</li><li>Keep the default 24-hour rekey (range 10 seconds to 14 days); if changed, keep it at least twice the OMP graceful-restart timer.</li></ul>
  <h2>Session timeouts</h2>
  ${tbl(['Setting','Default','Guidance'],[['Client session timeout','Configurable','Shortest practical'],['Server session timeout','30 minutes','Shortest practical'],['Session lifetime','24 hours','Per policy'],['Maximum sessions per role','Configurable','As low as operations allow'],['CLI idle timeout','1800 seconds','Shortest that suits the workflow']])}
  ${code('Set the CLI idle timeout','config\nsystem\nidle-timeout 10\ncommit\nend\n\n# log out, log back in, then verify\nshow cli')}
  <h2>Logging</h2>
  <p>Logging covers device syslog, overlay events and alarms, audit trails of admin actions, and ACL and firewall logs. Audit, ACL and syslog are aggregated in Manager. Edge devices log under <code>/var/log</code> and can forward over UDP, TCP or TLS; prefer TLS. Firewall high-speed logging exports zone-based firewall sessions as NetFlow v9. See <a href="#enable">Enable logging</a> for retention steps.</p>
  <h2>SSH</h2>
  <ul class="plain"><li>Edge SSH supports RSA keys from 2048 to 4096 bits; at most two keys per user, stored in <code>~/.ssh/authorized_keys</code>.</li><li>Set the authentication order deliberately, for example TACACS+ or RADIUS first and local last; manage SSH and AAA consistently through templates.</li><li>Restrict SSH to management networks and bastion hosts. Use key-based auth only, with no shared accounts.</li><li>Rotate per-admin keys and remove them immediately on offboarding or incident. Keep private keys only on jump hosts, never on Validators or Controllers.</li><li>Disable weak algorithms (SHA-1, AES-128, AES-192) once all devices support it. Centralise SSH session logs and alert on unexpected access.</li></ul>
</div>`;

/* ---- about ---- */
TITLES.about='About and sources';
PAGES.about=()=>`<div class="page">
  <h1>About and sources</h1>
  <p class="lede">A proof-of-concept log specification site consolidating three documents. Treat configuration as guidance to validate, not as tested procedure.</p>
  <h2>Sources</h2>
  ${tbl(['Document','Version','Used for'],[['Cisco SD-WAN Threat Hunt Guide (ASD’s ACSC-led, with NCSC-NZ, CISA, NSA, CCCS and NCSC-UK)','v2.4, February 2026','Tradecraft, 25 detections, log paths and samples, mitigations'],['Cisco Catalyst SD-WAN Hardening Guide','rev 1.1, 9 February 2026','Log descriptions, perimeter, RBAC, SSH, logging and timeouts'],['Cisco Catalyst SD-WAN Architecture','Architecture write-up','Components, planes, trust and onboarding, VPN model, deployment models, flows, HA, boundaries and logging touchpoints'],['Cisco Catalyst SD-WAN Log Reference','Field reference (two revisions), itself drawn from Cisco’s hardening guide, Network Monitoring Guide, System Logging documentation and observed samples','Schemas, formats, component mapping, sources, parsing (Splunk, Edge Processor, Ingest Processor) and enablement']])}
  <h2>Conventions</h2>
  <ul class="plain"><li>Detection numbers follow the hunt guide’s section headings. Several IDs printed inside its tables are one higher; each detection page shows both.</li><li>Notes marked “inferred” are analyst judgement, not stated by either guide.</li><li>Samples use placeholders as published (&lt;ACTOR IP&gt;, &lt;REDACTED IP&gt;) or documentation IP ranges, and are illustrative.</li><li>The TLS syslog keywords and some CLI values vary by release and need validating.</li></ul>
  <h2>Detection table standards</h2>
  <p class="sub">The hunt guide’s detection tables follow Sigma conventions so they can be translated into SIEM rules.</p>
  ${tbl(['Field','Meaning'],[['title','Human-readable name in title case (Sigma title)'],['id','<span class="mono">&lt;TACTIC&gt;-&lt;TECH&gt;-&lt;SHORT&gt;-&lt;SEQ&gt;</span>'],['status','stable, experimental or test; experimental if unsure'],['description','What it finds and why it matters'],['references','Relevant links'],['tags','ATT&amp;CK IDs as attack.t####'],['logsource','Product, service and category'],['detection','Core logic: conditions, sequences, patterns'],['conditions','Specific patterns, part of Sigma detection'],['falsepositives','Benign triggers'],['level','low, medium, high or critical'],['analytic_validation','Custom metadata: how to confirm'],['samples','At least two full representative lines'],['related','Links to other detections']])}
  <h2>Glossary</h2>
  ${tbl(['Term','Meaning'],[['Manager (vManage)','Orchestration, UI, policy and audit component'],['Controller (vSmart)','Control-plane component distributing routes and policy over OMP'],['Validator (vBond)','Orchestration endpoint for initial bring-up'],['NMS','The hunt guide’s collective name for Manager, Controller and Validator'],['VPN 0 / VPN 512','Transport and management VPNs'],['OMP','Overlay Management Protocol'],['BFD','Bidirectional Forwarding Detection'],['TLOC','Transport locator: system-IP, color and encapsulation'],['DTLS / TLS','Datagram and stream TLS protecting control connections'],['NETCONF','Network configuration protocol on TCP 830'],['ZTP / PnP','Zero-touch provisioning and Plug and Play'],['Admin-tech','Cisco diagnostic bundle of logs and state'],['PAM','Pluggable Authentication Module'],['SD-WAN','Software-Defined Wide Area Network']])}
  <h2>Handling and disclaimer</h2>
  <p>The hunt guide is provided as is for informational purposes, and its co-sealers don’t endorse any commercial product. ASD applies FIRST Traffic Light Protocol definitions, and information it shares without a TLP marking is treated as AMBER (need-to-know sharing within your organisation and its service providers) unless ASD agrees otherwise in writing. Check the marking on your copy before sharing this site outside your organisation.</p>
</div>`;

/* ===== ARCHITECTURE ===== */
TITLES.architecture='Architecture';
const nd=(t,s,cls='')=>`<div class="nd ${cls}"><b>${t}</b>${s?`<span>${s}</span>`:''}</div>`;
const cn=(t,cls='')=>`<div class="conn ${cls}" aria-hidden="true"><span>${t}</span></div>`;
const fig=(id,cap,body)=>`<figure class="dg" id="${id}">${body}<figcaption>${cap}</figcaption></figure>`;
const jump=(id,t)=>`<a href="#architecture" data-scroll="${id}">${t}</a>`;
const ar=(rows)=>`<dl class="spec">${rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`;
PAGES.architecture=()=>`<div class="page">
  <h1>Architecture</h1>
  <p class="lede">How Cisco Catalyst SD-WAN (formerly Viptela) fits together: the control components, the planes they run, how devices are trusted, and the boundaries that hardening and logging depend on. Read this first if you’re new to the platform.</p>
  <div class="note">Contents: ${[['a-overview','Overview'],['a-components','Core components'],['a-planes','Planes'],['a-trust','Trust and onboarding'],['a-vpn','VPN segmentation'],['a-deploy','Deployment models'],['a-flows','Control and data flows'],['a-admin','Administrative access'],['a-ha','High availability'],['a-bound','Security boundaries'],['a-logging','Logging touchpoints'],['a-diagrams','Diagram index'],['a-ports','Port reference']].map(([i,t])=>jump(i,t)).join(' · ')}</div>

  <h2 id="a-overview">Overview</h2>
  <p>Catalyst SD-WAN is an overlay WAN that separates four concerns:</p>
  ${tbl(['Concern','What it covers'],[['<b>Orchestration</b>','How devices find the fabric and authenticate'],['<b>Control plane</b>','Topology, routing policy and key distribution'],['<b>Data plane</b>','Encrypted site-to-site and site-to-service traffic'],['<b>Management plane</b>','Configuration, monitoring and audit']])}
  <p>The fabric is <b>zero trust</b>: no device is trusted until it presents a valid identity (certificate plus authorised serial) and builds mutually authenticated DTLS or TLS control connections.</p>
  ${fig('d-fabric','Fabric overview: control components above, WAN edges below.',`
   <div class="nrow">${nd('Manager','vManage','ctl')}${nd('Controller','vSmart','ctl')}${nd('Validator','vBond','ctl')}</div>
   ${cn('Control plane · DTLS / TLS')}
   <div class="nrow">${nd('WAN Edge','Site A','edge')}${nd('WAN Edge','Site B','edge')}${nd('WAN Edge','Site C','edge')}</div>
   <div class="hbar"><span>Data plane · IPsec / Enhanced ESP between all sites</span></div>`)}

  <h2 id="a-components">Core components</h2>
  <h3>Manager (vManage)</h3>
  ${ar([['Role','Central management, orchestration UI, policy design, monitoring and audit'],['Functions','Device templates and configuration groups, certificates, software images, alarms, analytics, multitenant provider views'],['Interfaces','HTTPS UI (TCP 443), NETCONF to Controllers and Validators (TCP 830), SSH, REST API'],['VPNs','VPN 0 (transport and control), VPN 512 (management, out of band preferred)'],['Trust role','Authoritative list of authorised device serials; runs the fabric’s certificate lifecycle'],['Scale','Clusterable; multi-core instances use separate control ports (base + 100 per core)']])}
  <p><b>Why it matters:</b> the main target for credential abuse and audit-log tampering. It holds RBAC, SSO and MFA, password policy and session timeouts, and is the source of the structured ${ll('audit')} and ${ll('alarms')}.</p>
  <h3>Controller (vSmart)</h3>
  ${ar([['Role','Control-plane brain: OMP route reflection, policy distribution, keying assistance'],['Functions','Keeps DTLS and TLS sessions to edges and other Controllers; distributes routing and centralised policy; supports pairwise or traditional IPsec keying'],['Interfaces','DTLS (UDP 12346+), TLS (TCP 23456+), NETCONF from Manager, SSH'],['VPNs','VPN 0 for control; VPN 512 for management'],['Trust role','Accepts only edges whose serials are authorised in Manager; enforces certificate-based peer authentication']])}
  <p><b>Why it matters:</b> compromise can influence routing and policy across the whole fabric. Its ${ll('vsyslog')} and ${ll('vdebug')} are the primary sources for rogue-peer and auth-fail hunts, and it was the actor’s early focus.</p>
  <h3>Validator (vBond)</h3>
  ${ar([['Role','First contact and orchestrator: authenticates devices and tells them how to reach Managers and Controllers'],['Functions','DTLS and TLS bring-up, NAT traversal help, redirecting edges to the right control components'],['Interfaces','DTLS UDP 12346 and hopping ports; management through VPN 512, SSH and NETCONF from Manager'],['Trust role','Validates device identity during onboarding; must be reachable from edges, so often public or DMZ-facing']])}
  <p><b>Why it matters:</b> an internet- or DMZ-exposed attack surface if self-hosted poorly. Management ports 22, 443 and 830 must never face the internet.</p>
  <h3>WAN edge devices</h3>
  ${ar([['Role','Site routers (IOS XE Catalyst SD-WAN or vEdge) that form the data plane'],['Functions','IPsec tunnels, local policy, DIA and SIG, zone-based firewall, AppQoE and more'],['Control','Permanent DTLS or TLS sessions to Controllers; initial session through the Validator'],['Data','Enhanced ESP (AES-GCM-256) overlay tunnels between TLOCs']])}
  <p class="sub">Edge hardening is covered by Cisco’s IOS XE Software Hardening Guide; the Catalyst SD-WAN Hardening Guide focuses on control components.</p>
  ${fig('d-rel','Component relationships: identity flows from PKI and the serial allow-list; Manager configures the other components over NETCONF.',`
   <div class="nrow" style="--n:1;max-width:320px;margin:0 auto">${nd('Identity / PKI','Cisco or enterprise','ext')}</div>
   ${cn('certificates + serial allow-list')}
   <div class="nrow">${nd('Manager','vManage','ctl')}${nd('Controller','vSmart','ctl')}${nd('Validator','vBond','ctl')}</div>
   <div class="nrow lbls"><span>→ NETCONF to Controller<br>HTTPS / API</span><span>OMP · DTLS / TLS</span><span>→ Controller locator<br>DTLS bring-up</span></div>
   ${cn('')}
   <div class="nrow" style="--n:1;max-width:320px;margin:0 auto">${nd('WAN Edges','sites and TLOCs','edge')}</div>`)}

  <h2 id="a-planes">Planes of operation</h2>
  ${fig('d-planes','The three planes. The data plane keeps running if Manager is unreachable once keys and policy are in place.',`
   <div class="band b1"><b>Management plane</b><span>Manager UI and API, SSH, NETCONF, AAA, audit, RBAC. Preferred path: VPN 512 out of band, jump host, MFA.</span></div>
   <div class="band b2"><b>Control plane</b><span>Validator bring-up, Controller OMP, DTLS and TLS, policy and keys. Path: VPN 0 transport on UDP 12346+ and TCP 23456+.</span></div>
   <div class="band b3"><b>Data plane</b><span>Edge-to-edge and edge-to-service IPsec with Enhanced ESP. Independent of Manager reachability once keys and policy are set.</span></div>`)}
  ${tbl(['Plane','Components','Protocols','If it fails'],[['Management','Manager','HTTPS, SSH, NETCONF, REST','Configuration and monitoring lost; the data plane can continue'],['Control','Validator, Controller, edges','DTLS and TLS, OMP','No new policy or routes; existing tunnels may persist until rekey or timeout'],['Data','Edges','IPsec (Enhanced ESP)','Site connectivity lost']])}

  <h2 id="a-trust">Trust and onboarding</h2>
  ${fig('d-onboard','How an edge joins the fabric. The rogue-peer zero-day abused this path to get a trusted peer into the control plane.',`
   <div class="flow">${nd('Edge boots or runs ZTP','')}${cn('')}${nd('Contacts the Validator','mutual certificate auth · serial must be authorised in Manager','ctl')}${cn('')}${nd('Validator returns locators','for Controllers and Manager','ctl')}${cn('')}${nd('Edge builds DTLS / TLS to Controllers','','ctl')}${cn('')}${nd('OMP, policy and key material','','ctl')}${cn('')}${nd('Edge builds IPsec to other TLOCs','data plane','edge')}</div>`)}
  <h3>Identity elements</h3>
  <ul class="plain"><li>Device certificate (SUDI, enterprise or Cisco-hosted)</li><li>Serial number allow-listed in Manager</li><li>Consistent organisation name and domain</li></ul>
  <h3>Security implications</h3>
  <ul class="plain"><li>An unknown peer-type, or an auth failure such as ERR_SER_NUM_NT_PRESENT on a Controller, is a high-signal event: see ${dls('004 005 010')}.</li><li>Only Manager should drive permanent identity lifecycle changes.</li></ul>

  <h2 id="a-vpn">Network segmentation (VPN model)</h2>
  <p>VPN IDs work like VRFs.</p>
  ${tbl(['VPN','Purpose','Exposure guidance'],[['<b>VPN 0</b>','Transport, underlay and control connections','Reaches Validators and Controllers; often DMZ-facing on self-hosted control components'],['<b>VPN 512</b>','Management, out of band','Jump hosts only; never publish 22, 443 or 830 to the internet'],['<b>Service VPNs</b> (1–511 and others)','User and site traffic','Segmented per tenant or application as designed']])}
  ${fig('d-vpn','VPN 0 faces the DMZ; VPN 512 is reachable only from jump hosts and the management VLAN.',`
   <div class="flow">${nd('Internet / underlay','','ext')}${cn('')}${nd('Firewall','DMZ','fw')}${cn('VPN 0 · transport')}
   <div class="nrow">${nd('Validator','','ctl')}${nd('Controller','','ctl')}${nd('Manager','','ctl')}</div>${cn('VPN 512 · management, only from jump hosts or management VLAN')}${nd('Jump hosts + AAA','','ext')}</div>`)}

  <h2 id="a-deploy">Deployment models</h2>
  <div class="g2">
   <div class="card"><h3>Cisco-hosted (Cloud, Cloud Pro)</h3><ul class="plain" style="margin:0;color:var(--muted);font-size:.92rem"><li>Control components run in Cisco’s cloud.</li><li>You set inbound IP and port allow lists in the Catalyst SD-WAN Portal.</li><li>Edges still authenticate with certificates and serials, so edge IPs don’t need allow-listing.</li><li>A per-fabric rule limit applies (for example 200).</li></ul></div>
   <div class="card"><h3>Self-hosted</h3><ul class="plain" style="margin:0;color:var(--muted);font-size:.92rem"><li>You run the Manager, Controller and Validator VMs or appliances.</li><li>You implement perimeter ACLs and firewalls, a DMZ for VPN 0 and out-of-band VPN 512.</li><li>Jump hosts and MFA for admin access.</li><li>Full responsibility for syslog, backups, patching and certificate operations.</li></ul></div>
  </div>
  ${fig('d-deploy','Who owns the perimeter in each model.',`
   <div class="g2"><div class="flow">${nd('Cisco cloud fabric','Cisco-hosted','ctl')}${cn('Portal allow list')}${nd('Edges','customer sites','edge')}</div>
   <div class="flow">${nd('Customer DC or cloud','self-hosted','ctl')}${cn('Firewall + DMZ')}${nd('Edges','customer sites','edge')}</div></div>`)}

  <h2 id="a-flows">Control and data plane flows</h2>
  <h3>Control plane ports (typical)</h3>
  ${tbl(['Path','Protocol and port','Notes'],[['Edge → Validator','<span class="mono">UDP 12346</span> (+ hop offsets)','Bring-up'],['Edge → Controller or Manager','<span class="mono">UDP 12346</span> DTLS, <span class="mono">TCP 23456</span> TLS','Base ports for core 0'],['Additional cores','Base + 100 per core','Core 1: UDP 12446, TCP 23556'],['Manager → Controller or Validator','<span class="mono">TCP 830</span> NETCONF','Configuration operations'],['Admin → Manager','<span class="mono">TCP 443</span> HTTPS, <span class="mono">TCP 22</span> SSH','Through a jump host']])}
  <h3>Data plane</h3>
  <ul class="plain"><li>Enhanced ESP with AES-GCM-256 by default.</li><li>Optional integrity modes: esp, ip-udp-esp, ip-udp-esp-no-id.</li><li>Pairwise ECDH (P-384) or Controller-distributed keys.</li><li>Default rekey is 24 hours and should stay at least twice the OMP graceful-restart timer.</li></ul>
  ${fig('d-data','Edges exchange data directly over IPsec; each keeps its own control session to the Controllers.',`
   <div class="pair">${nd('Site A edge','TLOC','edge')}<div class="hlink"><span>IPsec · ESP-GCM<br>TLOC ↔ TLOC</span></div>${nd('Site B edge','TLOC','edge')}</div>
   <div class="pair up"><span>DTLS / TLS control ↑</span><span></span><span>↑ DTLS / TLS control</span></div>
   <div class="nrow" style="--n:1;max-width:320px;margin:0 auto">${nd('Controllers','vSmart','ctl')}</div>`)}

  <h2 id="a-admin">Management and administrative access</h2>
  ${fig('d-admin','The only supported way in for administrators.',`
   <div class="flow">${nd('Admin workstation','','ext')}${cn('Corporate VPN + MFA')}${nd('Jump host','bastion','fw')}${cn('SSH / HTTPS only from the jump host')}${nd('VPN 512','Manager, Controller and Validator management interfaces','ctl')}</div>`)}
  <h3>Hardening expectations</h3>
  <ul class="plain"><li>No direct internet exposure of 22, 443 or 830 on control components.</li><li>Key-based SSH; at most two keys per user; no private keys on Controllers or Validators.</li><li>RBAC roles: netadmin, operator, network_operations, security_operations, and custom least-privilege roles.</li><li>Client, server and CLI idle session timeouts aligned to policy.</li><li>SSO or Duo MFA where available.</li></ul>
  <p class="sub">Details are on <a href="#hardening">Hardening</a>.</p>

  <h2 id="a-ha">High availability and scaling</h2>
  ${tbl(['Component','HA pattern','Notes'],[['Manager','Cluster of several nodes','UI, API and configuration durability'],['Controller','Several vSmarts','Edges connect to more than one; OMP redundancy'],['Validator','Several vBonds','DNS or list-based discovery; critical for onboarding'],['Edges','Dual TLOCs or dual devices','Transport and device redundancy']])}
  <p>Multi-core control instances open extra control ports (base + 100 × core index). Firewalls must allow the full set in use, and log collection must cover every node.</p>

  <h2 id="a-bound">Security boundaries</h2>
  ${fig('d-bound','Trust zones from the internet inwards.',`
   <div class="flow">
   <div class="zone z0"><b>Internet / untrusted underlay</b></div>${cn('only control ports to the Validator (and Controller or Manager if required)')}
   <div class="zone z1"><b>DMZ / VPN 0</b><span>Validators, plus Controller and Manager transport interfaces</span></div>${cn('no direct admin from the internet')}
   <div class="zone z2"><b>Management VPN 512 / out of band</b><span>Jump hosts → Manager UI and API, SSH, NETCONF sources</span></div>${cn('')}
   <div class="zone z3"><b>Fabric overlay (data plane)</b><span>Edge TLOCs, service VPNs, optional security stack</span></div></div>`)}
  <h3>Boundary controls</h3>
  <ol class="plain"><li>Portal or firewall allow lists for control-component reachability.</li><li>Localized policy ACLs on VPN 512 for finer source restriction.</li><li>Certificate and serial identity, not IP trust.</li><li>RBAC and MFA on Manager.</li><li>Centralised logging off the box, because local logs can be wiped.</li></ol>

  <h2 id="a-logging">Logging touchpoints by component</h2>
  ${tbl(['Component','High-value logs'],[['<b>Manager</b>',[ll('audit'),ll('alarms'),ll('nms'),ll('vsyslog'),ll('auth')].join(', ')],['<b>Controller</b>',[ll('vsyslog'),ll('vdebug')+' (incident response)',ll('auth'),ll('vconfd')].join(', ')],['<b>Validator</b>',[ll('vsyslog'),ll('vdebug')+' (incident response)',ll('auth')].join(', ')],['<b>All control components</b>',[ll('kern'),ll('runit'),ll('ssh'),ll('rollback')].join(', ')],['<b>Perimeter</b>',ll('firewall')+' allow and deny for 22, 443, 830, 12346 and 23456']])}
  <p class="sub">Full detail is on <a href="#components">Components and sources</a> and in each <a href="#spec">log specification</a>.</p>

  <h2 id="a-diagrams">Diagram index</h2>
  ${tbl(['Diagram','Purpose'],[[jump('d-fabric','Fabric overview'),'Manager, Controller, Validator and edges'],[jump('d-rel','Component relationships'),'PKI, NETCONF, control versus data'],[jump('d-planes','Planes'),'Management, control and data'],[jump('d-onboard','Onboarding flow'),'Edge → Validator → Controller'],[jump('d-vpn','VPN 0 and 512 placement'),'DMZ versus out-of-band management'],[jump('d-deploy','Hosted versus self-hosted'),'Operational responsibility'],[jump('d-data','Edge-to-edge data plane'),'IPsec overlay'],[jump('d-admin','Admin access path'),'Jump host model'],[jump('d-bound','Security boundaries'),'Trust zones']])}

  <h2 id="a-ports">Port quick reference</h2>
  ${tbl(['Port','Use'],[['<span class="mono">UDP 12346</span> (+ hops, +100 per core)','DTLS control'],['<span class="mono">TCP 23456</span> (+100 per core)','TLS control'],['<span class="mono">TCP 443</span>','Manager UI and API'],['<span class="mono">TCP 22</span>','SSH, management only'],['<span class="mono">TCP 830</span>','NETCONF, Manager → control components'],['<span class="mono">UDP 53, UDP 123</span>','DNS and NTP if used on VPN 0']])}
  <h2>Related documents</h2>
  <ul class="plain"><li>Cisco Catalyst SD-WAN Hardening Guide (summarised on <a href="#hardening">Hardening</a>)</li><li>Cisco IOS XE Software Hardening Guide, for WAN edges</li><li>Cisco Catalyst SD-WAN Design Guide</li><li>Cisco SD-WAN Log Reference (the basis of the <a href="#spec">log specification</a>)</li></ul>
</div>`;

/* ===== HUNT EXPLORER ===== */
TITLES.hunt='Hunt explorer';
PAGES.hunt=()=>`<div class="page" style="max-width:1240px">
  <h1>Hunt explorer</h1>
  <p class="lede">Pick a stage, detection or log type to trace its links. Lines join related items on wide screens; the panel shows the detail.</p>
  <div class="exhead">
    <div class="legend"><span><span class="sw" style="background:var(--syslog)"></span>Syslog</span><span><span class="sw" style="background:var(--local)"></span>Local log or API</span><span><span class="sw" style="background:var(--disk)"></span>Disk artefact</span><span><span class="sw" style="background:var(--crit)"></span>Critical</span><span><span class="sw" style="background:var(--high)"></span>High</span><span><span class="sw" style="background:var(--med)"></span>Medium</span><span><span class="sw" style="background:var(--low)"></span>Low</span></div>
    <div class="row" style="margin:0"><button class="btn sm" id="only" type="button" aria-pressed="false">Show only linked</button><button class="btn sm" id="clr" type="button">Clear</button></div>
  </div>
  <div class="explorer" id="explorer"><svg id="wires" aria-hidden="true"></svg>
    <div class="ex-t"><h4>Stage</h4><div class="list" id="ct"></div></div>
    <div class="ex-d"><h4>Detection</h4><div class="list" id="cd"></div></div>
    <div class="ex-l"><h4>Log type</h4><div class="list" id="cl"></div></div>
    <div class="detail" id="xdet" aria-live="polite"><p class="m" style="margin:0">Nothing selected. Try the debug log: it feeds ${LMAP.vdebug.dets.length} detections and never reaches your SIEM.</p></div>
  </div></div>`;
let XSEL=null,XPAIRS=null,PENDING=null;const XITEMS={};
AFTER.hunt=()=>{Object.keys(XITEMS).forEach(k=>delete XITEMS[k]);XSEL=null;XPAIRS=null;
  const mk=(col,key,cls,kids)=>{const b=document.createElement('button');b.type='button';b.className='item '+cls;b.innerHTML=kids;b.onclick=()=>xpick(key);document.getElementById(col).appendChild(b);XITEMS[key]=b;};
  TORDER.forEach(k=>mk('ct','t:'+k,'',`<span>${TAC[k].n}</span>`));
  DETS.forEach(d=>mk('cd','d:'+d[0],'',`<span class="lv" style="background:${LVC[d[6]]}"></span><span class="id">${d[0]}</span><span>${esc(d[2])}</span>`));
  LOGS.forEach(l=>mk('cl','l:'+l.k,l.c,`<span class="id">${l.id.slice(3)}</span><span class="p">${esc(l.paths[0])}</span>`));
  const ex=document.getElementById('explorer'),ob=document.getElementById('only');
  const setOnly=v=>{ex.classList.toggle('only',v);ob.setAttribute('aria-pressed',v);requestAnimationFrame(()=>xdraw());};
  ob.onclick=()=>setOnly(ob.getAttribute('aria-pressed')!=='true');
  document.getElementById('clr').onclick=()=>xclear();
  if(matchMedia('(max-width:900px)').matches)setOnly(true);
  if(PENDING){const p=PENDING;PENDING=null;xpick(p);}
};
function xlinks(key){const [t,id]=key.split(':');let ds=[];
  if(t==='t')ds=DETS.filter(d=>d[3]===id);if(t==='d')ds=DETS.filter(d=>d[0]===id);if(t==='l')ds=DETS.filter(d=>d[15].includes(id));
  const set=new Set([key]),pairs=[];
  ds.forEach(d=>{set.add('d:'+d[0]);set.add('t:'+d[3]);pairs.push(['t:'+d[3],'d:'+d[0]]);d[15].forEach(l=>{if(t!=='l'||l===id){set.add('l:'+l);pairs.push(['d:'+d[0],'l:'+l]);}});});
  return {set,ds,pairs};}
function xdraw(){const svg=document.getElementById('wires');if(!svg)return;svg.innerHTML='';if(!XPAIRS||getComputedStyle(svg).display==='none')return;
  const box=document.getElementById('explorer').getBoundingClientRect();
  XPAIRS.forEach(([a,b])=>{const ra=XITEMS[a].getBoundingClientRect(),rb=XITEMS[b].getBoundingClientRect();if(!ra.width||!rb.width)return;
    const x1=ra.right-box.left,y1=ra.top+ra.height/2-box.top,x2=rb.left-box.left,y2=rb.top+rb.height/2-box.top,mx=(x1+x2)/2;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);svg.appendChild(p);});}
function xpick(key){if(!XITEMS[key])return;if(XSEL===key){xclear();return;}XSEL=key;const {set,ds,pairs}=xlinks(key);XPAIRS=pairs;
  Object.entries(XITEMS).forEach(([k,n])=>{n.classList.toggle('dim',!set.has(k));n.classList.toggle('sel',k===key);n.classList.toggle('rel',set.has(k)&&k!==key);n.setAttribute('aria-pressed',k===key);});
  requestAnimationFrame(xdraw);
  const [t,id]=key.split(':');const box=document.getElementById('xdet');
  if(t==='d'){const d=DMAP[id];box.innerHTML=`<p class="t">${id} ${esc(d.t)}</p><p class="m">${lvl(d.lv)} · ${TAC[d.tac].n} · ${esc(d.tags.replace(/attack\./g,'').toUpperCase())}</p><p>${esc(d.desc)}</p><p class="m">Evidence: ${d.logs.map(ll).join(', ')}</p><pre>${esc(d.smp)}</pre><p><a href="#det-${id}">Full detection specification</a></p>`;}
  else if(t==='t'){const cnt={};ds.forEach(d=>cnt[d[6]]=(cnt[d[6]]||0)+1);box.innerHTML=`<p class="t">${TAC[id].n}</p><p class="m">${TAC[id].t}</p><p>${TAC[id].d}. ${ds.length} detection${ds.length>1?'s':''}: ${['critical','high','medium','low'].filter(k=>cnt[k]).map(k=>cnt[k]+' '+k).join(', ')}.</p><p><a href="#threat">Tradecraft detail</a></p>`;}
  else{const l=LMAP[id];const cs=[...new Set(ds.map(d=>TAC[d[3]].n.toLowerCase()))];box.innerHTML=`<p class="t">${l.id} ${esc(l.name)}</p><p class="m">${tag(l.c)} <span class="path">${esc(l.paths[0])}</span></p><p>${ds.length?`Feeds ${ds.length} detection${ds.length>1?'s':''} across ${cs.join(', ')}.`:'Supporting source; no detection uses it directly.'} Collect: ${esc(l.coll)}</p><pre>${esc(l.samples[0][1])}</pre><p><a href="#spec-${id}">Full log specification</a></p>`;}
}
function xclear(){XSEL=null;XPAIRS=null;Object.values(XITEMS).forEach(n=>{n.classList.remove('dim','sel','rel');n.setAttribute('aria-pressed','false');});xdraw();
  const b=document.getElementById('xdet');if(b)b.innerHTML='<p class="m" style="margin:0">Nothing selected.</p>';}
let RZ;addEventListener('resize',()=>{clearTimeout(RZ);RZ=setTimeout(xdraw,80);});

/* ===== SCHEMA EXPLORER ===== */
TITLES.schemas='Schema explorer';
function schemaPage(k){const l=LMAP[k]||LOGS[0];
  return `<div class="page" style="max-width:1240px">
  <h1>Schema explorer</h1>
  <p class="lede">Every log type’s structure, field by field. Hover or tap a field to find it in the sample, follow a detection number, and copy ready-made extractions.</p>
  <div class="schema"><nav class="slist" aria-label="Log types">${['syslog','local','disk'].map(g=>`<span class="grp">${CLS[g]}</span>`+LOGS.filter(x=>x.c===g).map(x=>`<a class="sbtn" href="#schemas-${x.k}" aria-current="${x.k===l.k}"><span class="sw" style="background:var(--${g})"></span>${esc(x.name)}</a>`).join('')).join('')}</nav>
  <div id="sv"></div></div></div>`;}
function toRex(name,rx){const src=rx.source;let i=-1;for(let j=0;j<src.length;j++){if(src[j]==='\\'){j++;continue;}if(src[j]==='('&&src[j+1]!=='?'){i=j;break;}}
  const g=name.replace(/[^\w]/g,'_').toLowerCase();return '| rex field=_raw "'+(i<0?src:src.slice(0,i+1)+'?<'+g+'>'+src.slice(i+1)).replace(/"/g,'\\"')+'"';}
function schemaAfter(k){const l=LMAP[k]||LOGS[0];const sv=document.getElementById('sv');const s=l.samples[0][1];
  let h=`<h2 style="margin:0;font-family:var(--mono);font-size:1.2rem;font-weight:500;overflow-wrap:anywhere">${esc(l.paths[0])}</h2>
  <div class="smeta">${tag(l.c)}<span class="idtag">${l.id}</span><span>${comp(l.comps)}</span><span class="mono">${esc(l.st)}</span><a href="#spec-${l.k}">Full specification</a></div>
  ${code('Format',l.fmt)}<p class="sub">${esc(l.note)}</p>
  <div class="shead"><h4>Sample, with fields marked</h4><button class="btn sm" id="mk" type="button" aria-pressed="true">Mark all fields</button></div><pre class="ssample" id="sp"></pre>
  <div class="shead"><h4>${l.fields.length} fields</h4></div>
  <div class="tw"><table class="ftable"><thead><tr><th>Field</th><th>Type</th><th>Meaning</th><th>In sample</th><th>Detections</th></tr></thead><tbody id="ftb"></tbody></table></div>`;
  let ex;if(l.json)ex='| spath input=_raw\n# or KV_MODE = json in props.conf\n# fields: '+l.fields.map(f=>f[0]).join(', ');
  else{const r=l.fields.filter(f=>f[2]).map(f=>toRex(f[0],f[2]));ex=(l.bin?'# '+(l.k==='wtmp'?'Binary: run last or lastlog during collection, then index that output with:':'Not a log stream: index collection output with:')+'\n':'')+r.join('\n');}
  h+=`<div class="shead"><h4>Extraction${l.st.startsWith('cisco')?' for '+esc(l.st):''}</h4></div>`+code('Generated from the schema',ex,'Classic SPL. Test against your own data before relying on it.');
  sv.innerHTML=h;
  const pre=document.getElementById('sp'),tb=document.getElementById('ftb');const ranges=[],vals={};
  l.fields.forEach((f,i)=>{if(!f[2])return;let r;try{r=new RegExp(f[2].source,f[2].flags.replace('d','')+'d');}catch(e){r=null;}if(!r)return;const m=r.exec(s);if(m){vals[i]=m[1];if(m.indices&&m.indices[1])ranges.push([m.indices[1][0],m.indices[1][1],i]);}});
  ranges.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);let pos=0;
  ranges.forEach(([a,b,i])=>{if(a<pos)return;if(a>pos)pre.appendChild(document.createTextNode(s.slice(pos,a)));const mk=document.createElement('mark');mk.textContent=s.slice(a,b);mk.dataset.f=i;mk.title=l.fields[i][0];pre.appendChild(mk);pos=b;});
  if(pos<s.length)pre.appendChild(document.createTextNode(s.slice(pos)));
  l.fields.forEach((f,i)=>{const tr=document.createElement('tr');tr.tabIndex=0;
    tr.innerHTML=`<td>${esc(f[0])}</td><td class="ty">${esc(f[1])}</td><td>${esc(f[3])}</td><td class="val">${vals[i]!==undefined?esc(vals[i]):'–'}</td><td>${dls(f[4])}</td>`;
    const on=v=>{tr.classList.toggle('on',v);pre.querySelectorAll(`mark[data-f="${i}"]`).forEach(m=>m.classList.toggle('on',v));};
    tr.onmouseenter=()=>on(true);tr.onmouseleave=()=>{if(!tr.classList.contains('pin'))on(false);};tr.onfocus=()=>on(true);tr.onblur=()=>{if(!tr.classList.contains('pin'))on(false);};
    tr.onclick=e=>{if(e.target.closest('a'))return;const v=!tr.classList.contains('pin');tr.classList.toggle('pin',v);on(v);};tb.appendChild(tr);});
  pre.querySelectorAll('mark').forEach(m=>{const i=+m.dataset.f;m.onmouseenter=()=>{m.classList.add('on');tb.children[i].classList.add('on');};m.onmouseleave=()=>{m.classList.remove('on');tb.children[i].classList.remove('on');};});
  const mb=document.getElementById('mk');mb.onclick=()=>{const v=mb.getAttribute('aria-pressed')!=='true';mb.setAttribute('aria-pressed',v);pre.classList.toggle('plain',!v);};
}

/* ===== TRIAGE ===== */
TITLES.triage='Triage a log line';
PAGES.triage=()=>`<div class="page">
  <h1>Triage a log line</h1>
  <p class="lede">Paste lines from a control component, a shell history or a rollback file. The page works out the sourcetype, pulls out the fields that matter and lists the hunt detections it touches.</p>
  <label for="tin" class="sub" style="display:block;margin:0 0 6px">Log lines</label>
  <textarea id="tin" spellcheck="false" placeholder="[VDAEMON_0 pid: 2852] … control-connection-state-change … peer-type:vhub … new-state:up"></textarea>
  <p class="err" id="terr" hidden>Paste a log line first, or load an example.</p>
  <div class="row"><button class="btn pri" id="trun" type="button">Check lines</button><span class="sub" style="margin:0 4px 0 8px">Examples:</span><span id="texs" class="row" style="margin:0"></span></div>
  <p class="sub" style="margin-top:.6rem">Checking happens in your browser. Nothing you paste leaves this page. Ctrl or Cmd + Enter also runs it.</p>
  <div id="tout" aria-live="polite"></div></div>`;
AFTER.triage=()=>{const tin=document.getElementById('tin'),terr=document.getElementById('terr'),tout=document.getElementById('tout');
  TEX.forEach(([n,v])=>{const b=document.createElement('button');b.className='btn sm';b.type='button';b.textContent=n;b.onclick=()=>{tin.value=v;terr.hidden=true;run();};document.getElementById('texs').appendChild(b);});
  tin.oninput=()=>{terr.hidden=true;};tin.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();run();}};
  document.getElementById('trun').onclick=run;
  function run(){const s=tin.value.trim();tout.innerHTML='';if(!s){terr.hidden=false;tin.focus();return;}
    const st=(ROUTE_RX.find(([,rx])=>rx.test(s))||['other'])[0];const order=['critical','high','medium','low'];
    const hits=RULES.filter(r=>r[1](s)).map(r=>({d:DMAP[r[0]],note:r[2],ctx:r[3]==='context'})).sort((a,b)=>(a.ctx-b.ctx)||(order.indexOf(a.d.lv)-order.indexOf(b.d.lv)));
    const strong=hits.filter(h=>!h.ctx).length;
    const head=hits.length?(strong?strong+(strong===1?' detection matches':' detections match'):'No direct match')+(hits.length>strong?', '+(hits.length-strong)+' need more context':''):'No hunt detection matches';
    const cards=hits.length?hits.map(h=>`<div class="hit" style="border-left-color:${h.ctx?'var(--rule)':LVC[h.d.lv]}"><div class="h"><span class="mono">${h.d.id}</span><strong>${esc(h.d.t)}</strong>${h.ctx?'<span class="lvl low">context</span>':lvl(h.d.lv)}</div><p>${esc(h.note)}</p><a class="btn sm" href="#det-${h.d.id}">Open detection</a> <a class="btn sm" href="#hunt" data-pick="d:${h.d.id}">Trace</a></div>`).join(''):`<p class="sub">${st==='auth'?'A normal login. Check the source IP is a jump host or management subnet.':'Nothing here matches the hunt guide’s conditions. Keep it as context and check the timeline around it.'}</p>`;
    const stk=Object.keys(LMAP).find(k=>LMAP[k].st==='cisco:sdwan:'+st);
    const fields=FIELDS.map(([n,rx])=>{const m=s.match(rx);return m?`<dt>${esc(n)}</dt><dd>${esc(m[1])}</dd>`:'';}).join('');
    tout.innerHTML=`<div class="res"><div><h3 style="margin:0 0 .8rem;font-size:1rem">${head}</h3>${cards}</div><div class="kv"><h3 style="margin:0 0 .8rem;font-size:1rem">What the page found</h3><dl><dt>sourcetype</dt><dd>cisco:sdwan:${esc(st)}${stk?` · <a href="#spec-${stk}">${LMAP[stk].id}</a>`:''}</dd>${fields}</dl></div></div>`;}
};

/* ===== NAV, ROUTER, SEARCH ===== */
const NAV=[['Start',[['overview','Overview'],['architecture','Architecture'],['threat','Threat and tradecraft']]],
 ['Specification',[['spec','Log specification'],['schemas','Schema explorer'],['formats','Formats and severity'],['components','Components and sources']]],
 ['Detection',[['detections','Detections'],['hunt','Hunt explorer'],['triage','Triage a log line']]],
 ['Operations',[['enable','Enable logging'],['parsing','SIEM parsing'],['hardening','Hardening']]],
 ['Reference',[['about','About and sources']]]];
const side=document.getElementById('side'),main=document.getElementById('main');
side.innerHTML=NAV.map(([g,items])=>`<h5>${g}</h5>`+items.map(([k,t])=>`<a href="#${k}" data-nav="${k}">${t}</a>`).join('')).join('')+'<p class="poc">Proof of concept. Validate configuration on your release before use.</p>';
let LAST='';
function render(){CODES.length=0;_renderInner(decodeURIComponent(location.hash.slice(1))||'overview');}
function _renderInner(h){let base=h,html=null,after=null,title='';
  if(h.startsWith('spec-')){base='spec';html=specPage(h.slice(5));title=LMAP[h.slice(5)]?LMAP[h.slice(5)].id+' '+LMAP[h.slice(5)].name:'';}
  else if(h.startsWith('det-')){base='detections';html=detPage(h.slice(4));title=DMAP[h.slice(4)]?'Detection '+h.slice(4):'';}
  else if(h==='schemas'||h.startsWith('schemas-')){const k=h.slice(8)||LOGS[0].k;base='schemas';if(LMAP[k]){html=schemaPage(k);after=()=>schemaAfter(k);title='Schema: '+LMAP[k].name;}}
  else if(PAGES[h]){html=PAGES[h]();after=AFTER[h];title=TITLES[h];}
  if(html===null){base='overview';CODES.length=0;html=PAGES.overview();after=null;title=TITLES.overview;}
  main.innerHTML=html;if(after)after();
  document.title=title+' · SD-WAN Log Specification';
  side.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===base?'page':'false'));
  const keep=LAST.startsWith('schemas')&&h.startsWith('schemas');
  if(!keep){scrollTo(0,0);main.focus({preventScroll:true});}
  LAST=h;closeMenu();}
addEventListener('hashchange',render);

/* delegated clicks */
document.addEventListener('click',async e=>{
  const ci=e.target.closest('[data-ci]');if(ci){const t=CODES[+ci.dataset.ci];try{await navigator.clipboard.writeText(t);ci.textContent='Copied';}catch(_){const pre=ci.closest('.block').querySelector('pre');const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);ci.textContent='Selected';}setTimeout(()=>ci.textContent='Copy',1600);return;}
  const pk=e.target.closest('[data-pick]');if(pk){PENDING=pk.dataset.pick;if(location.hash==='#hunt'){e.preventDefault();const p=PENDING;PENDING=null;if(XSEL!==p)xpick(p);}return;}
  const sc=e.target.closest('[data-scroll]');if(sc){e.preventDefault();const t=document.getElementById(sc.dataset.scroll);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return;}
  const tr=e.target.closest('tr[data-href]');if(tr&&!e.target.closest('a,button')){location.hash=tr.dataset.href;}
});
document.addEventListener('keydown',e=>{const tr=e.target.closest&&e.target.closest('tr[data-href]');if(tr&&e.key==='Enter'){location.hash=tr.dataset.href;}});

/* mobile menu */
const menuB=document.getElementById('menu'),scrim=document.getElementById('scrim');
function closeMenu(){side.classList.remove('open');scrim.hidden=true;menuB.setAttribute('aria-expanded','false');}
menuB.onclick=()=>{const o=!side.classList.contains('open');side.classList.toggle('open',o);scrim.hidden=!o;menuB.setAttribute('aria-expanded',o);};
scrim.onclick=closeMenu;addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});

/* theme */
(function(){const btn=document.getElementById('theme'),root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
  let s=null;try{s=localStorage.getItem('sdwan-spec-theme');}catch(e){}if(s==='dark'||s==='light')root.dataset.theme=s;
  const dark=()=>root.dataset.theme?root.dataset.theme==='dark':mq.matches;const lab=()=>{const t=dark()?'Light mode':'Dark mode';btn.innerHTML=`<span class="full">${t}</span><span class="short" aria-hidden="true">◐</span>`;btn.setAttribute('aria-label',t);};
  btn.onclick=()=>{const v=dark()?'light':'dark';root.dataset.theme=v;try{localStorage.setItem('sdwan-spec-theme',v);}catch(e){}lab();requestAnimationFrame(xdraw);};
  mq.addEventListener&&mq.addEventListener('change',lab);lab();})();

/* search */
const IDX=[];
NAV.forEach(([g,items])=>items.forEach(([k,t])=>IDX.push({h:'#'+k,k:'Page',t,s:g,x:t.toLowerCase()})));
LOGS.forEach(l=>{IDX.push({h:'#spec-'+l.k,k:l.id,t:l.name,s:l.paths.join(', '),x:(l.id+' '+l.name+' '+l.paths.join(' ')+' '+l.st+' '+l.desc).toLowerCase()});
  l.fields.forEach(f=>IDX.push({h:'#schemas-'+l.k,k:'Field',t:f[0],s:l.id+' '+l.name+' · '+f[3],x:(f[0]+' '+f[3]).toLowerCase(),w:1}));});
DETS.forEach(d=>IDX.push({h:'#det-'+d[0],k:d[0],t:d[2],s:TAC[d[3]].n+' · '+d[6],x:(d[0]+' '+d[1]+' '+d[2]+' '+d[7]+' '+d[12].join(' ')).toLowerCase()}));
const q=document.getElementById('q'),sres=document.getElementById('sres');let SI=-1,SR=[];
function search(){const v=q.value.trim().toLowerCase();if(!v){sres.hidden=true;q.setAttribute('aria-expanded','false');return;}
  const terms=v.split(/\s+/);SR=IDX.filter(it=>terms.every(t=>it.x.includes(t))).map(it=>({it,sc:(it.t.toLowerCase()===v?0:it.t.toLowerCase().startsWith(v)?1:it.k.toLowerCase()===v?0:2)+(it.w||0)})).sort((a,b)=>a.sc-b.sc).slice(0,12).map(o=>o.it);
  SI=SR.length?0:-1;sres.innerHTML=SR.length?SR.map((it,i)=>`<a href="${it.h}" role="option" class="${i===0?'on':''}"><span class="k">${esc(it.k)}</span>${esc(it.t)}<span class="s">${esc(it.s)}</span></a>`).join(''):`<div class="none">Nothing matches “${esc(q.value.trim())}”. Try a field such as peer-type, a path such as auth.log, or a detection number.</div>`;
  sres.hidden=false;q.setAttribute('aria-expanded','true');}
q.addEventListener('input',search);q.addEventListener('focus',()=>{if(q.value.trim())search();});
q.addEventListener('keydown',e=>{if(sres.hidden)return;const as=sres.querySelectorAll('a');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!as.length)return;SI=(SI+(e.key==='ArrowDown'?1:-1)+as.length)%as.length;as.forEach((a,i)=>a.classList.toggle('on',i===SI));as[SI].scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'&&SI>=0&&SR[SI]){e.preventDefault();location.hash=SR[SI].h;q.value='';sres.hidden=true;q.blur();}
  else if(e.key==='Escape'){sres.hidden=true;}});
sres.addEventListener('click',e=>{if(e.target.closest('a')){q.value='';sres.hidden=true;}});
document.addEventListener('click',e=>{if(!e.target.closest('.srch'))sres.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();q.focus();}});

render();

</script>
</body>
